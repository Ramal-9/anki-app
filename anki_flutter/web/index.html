<!DOCTYPE html>
<html>
<head>
  <!-- Replaced by the value of `flutter build web --base-href`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1B1B1D">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Anki-style flashcards with spaced repetition, AI pronunciation practice and phrase suggestions.">

  <!-- iOS: installable from Safari → Share → Add to Home Screen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Anki Flow">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Anki Flow</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // App icon chosen in Profile → App icon. iPhone and Mac read it when you
    // add the app to the Home Screen / Dock, so it is applied before anything else.
    window.afIcon = {
      get: function () { try { return localStorage.getItem('af_icon') || 'classic'; } catch (e) { return 'classic'; } },
      set: function (key) {
        try { localStorage.setItem('af_icon', key); } catch (e) {}
        var abs = function (p) { return new URL(p, document.baseURI).href; };
        var touch = key === 'classic' ? 'icons/apple-touch-icon.png?v=3' : 'icons/variants/' + key + '-180.png?v=3';
        var big = key === 'classic' ? 'icons/Icon-512.png' : 'icons/variants/' + key + '-512.png';
        document.querySelectorAll('link[rel="apple-touch-icon"]').forEach(function (l) { l.href = touch; });
        document.querySelectorAll('link[rel="icon"]').forEach(function (l) { l.href = touch; });
        if (key === 'classic') return;
        var manifest = {
          name: 'Anki Flow', short_name: 'Anki Flow', start_url: abs('./'), scope: abs('./'),
          display: 'standalone', background_color: '#1B1B1D', theme_color: '#1B1B1D',
          icons: [
            { src: abs('icons/variants/' + key + '-180.png'), sizes: '180x180', type: 'image/png' },
            { src: abs(big), sizes: '512x512', type: 'image/png' },
            { src: abs(big), sizes: '512x512', type: 'image/png', purpose: 'maskable' }
          ]
        };
        var link = document.querySelector('link[rel="manifest"]');
        if (link) link.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
      }
    };
    if (window.afIcon.get() !== 'classic') window.afIcon.set(window.afIcon.get());
  </script>
  <!-- The free online voices refuse requests that carry a referrer. -->
  <meta name="referrer" content="no-referrer">
  <style>
    html, body { margin: 0; height: 100%; background: #1B1B1D; }
    #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #splash img { width: 96px; height: 96px; border-radius: 22px; opacity: .92; }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt=""></div>

  <script>
    // ---------------------------------------------------------- offline
    // sw.js caches the whole app, so after the first visit it opens without internet.
    if ('serviceWorker' in navigator) {
      // A new version installs in the background; the page then reloads itself
      // (right away on start, otherwise the next time the app is reopened).
      var hadController = !!navigator.serviceWorker.controller;
      var startedAt = Date.now();
      var pendingReload = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadController) { hadController = true; return; }
        if (document.hidden || Date.now() - startedAt < 15000) location.reload();
        else pendingReload = true;
      });
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
        // Home Screen apps on iPhone resume without reloading, so check for updates on every return.
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) return;
          if (pendingReload) { location.reload(); return; }
          reg.update().catch(function () {});
        });
        setInterval(function () { reg.update().catch(function () {}); }, 30 * 60 * 1000);
      }).catch(function (e) { console.warn('SW', e); });
    }

    // ---------------------------------------------- notifications helpers
    window.afNotify = {
      permission: function () {
        return ('Notification' in window) ? Notification.permission : 'unsupported';
      },
      request: function () {
        if (!('Notification' in window)) return Promise.resolve('unsupported');
        return Promise.resolve(Notification.requestPermission()).then(function (p) { return p || Notification.permission; });
      },
      show: function (title, body) {
        var opts = { body: body, icon: 'icons/Icon-192.png', badge: 'icons/Icon-192.png', tag: 'anki-flow-reminder' };
        if ('serviceWorker' in navigator) {
          return navigator.serviceWorker.ready.then(function (reg) { return reg.showNotification(title, opts); })
            .catch(function () { new Notification(title, opts); });
        }
        try { new Notification(title, opts); } catch (e) {}
        return Promise.resolve();
      },
      download: function (name, text, mime) {
        var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if (ios && mime === 'text/calendar') {
          // Safari on iPhone opens calendar files directly with "Add All".
          window.location.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(text);
          return;
        }
        var url = URL.createObjectURL(new Blob([text], { type: mime }));
        var a = document.createElement('a');
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      }
    };

    // ---------------------------------------------------- natural voices
    // Plays mp3 URLs one after another through one <audio> element. iPhone only
    // allows sound after a tap, so the element is unlocked on the first tap and
    // reused for everything later (also after awaits).
    window.afTts = (function () {
      var audio = new Audio();
      audio.preload = 'auto';
      var unlocked = false, token = 0;
      function silence() {
        var n = 800, b = new ArrayBuffer(44 + n), v = new DataView(b);
        function w(o, s) { for (var i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }
        w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt ');
        v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
        v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true);
        v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
        for (var i = 0; i < n; i++) v.setUint8(44 + i, 128);
        return URL.createObjectURL(new Blob([b], { type: 'audio/wav' }));
      }
      function unlock() {
        if (unlocked) return;
        unlocked = true;
        audio.src = silence();
        var p = audio.play(); if (p && p.catch) p.catch(function () { unlocked = false; });
      }
      ['touchend', 'click', 'keydown'].forEach(function (e) { document.addEventListener(e, unlock, true); });

      function playOne(url, rate, my) {
        return new Promise(function (resolve) {
          var done = false, started = false;
          function end(ok) {
            if (done) return; done = true;
            audio.onended = audio.onerror = audio.onplaying = null;
            clearTimeout(timer); resolve(ok);
          }
          var timer = setTimeout(function () { if (!started) end(false); }, 7000);
          audio.onplaying = function () { started = true; };
          audio.onended = function () { end(true); };
          audio.onerror = function () { end(false); };
          audio.src = url;
          audio.preservesPitch = true; audio.webkitPreservesPitch = true;
          audio.defaultPlaybackRate = rate; audio.playbackRate = rate;
          var p = audio.play();
          if (p && p.catch) p.catch(function () { end(false); });
          // A long phrase must not hang forever.
          setTimeout(function () { if (my === token) end(true); }, 30000);
        });
      }
      return {
        play: function (urls, rate) {
          var my = ++token, played = 0;
          return urls.reduce(function (chain, url) {
            return chain.then(function (ok) {
              if (!ok || my !== token) return false;
              return playOne(url, rate, my).then(function (r) { if (r) played++; return r; });
            });
          }, Promise.resolve(true)).then(function (ok) { return ok || played > 0; });
        },
        stop: function () { token++; try { audio.pause(); } catch (e) {} if (audio.onended) audio.onended(); }
      };
    })();

    // --------------------------------------------- Generate Cards helpers
    // Opens the system file / photo picker. Resolves to {name, content} or null.
    window.afFiles = {
      pick: function (accept, asDataUrl) {
        return new Promise(function (resolve) {
          var input = document.createElement('input');
          input.type = 'file'; input.accept = accept; input.style.display = 'none';
          input.onchange = function () {
            var f = input.files && input.files[0];
            input.remove();
            if (!f) return resolve(null);
            var reader = new FileReader();
            reader.onload = function () { resolve({ name: f.name, content: String(reader.result) }); };
            reader.onerror = function () { resolve(null); };
            if (asDataUrl) reader.readAsDataURL(f); else reader.readAsText(f);
          };
          document.body.appendChild(input);
          input.click();
        });
      }
    };
    // Text recognition on photos with Tesseract.js (downloaded on first use).
    window.afOcr = function (dataUrl) {
      function run() {
        return Tesseract.recognize(dataUrl, 'eng+rus').then(function (r) { return r.data.text || ''; });
      }
      if (window.Tesseract) return run();
      return new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
        s.onload = function () { run().then(resolve, reject); };
        s.onerror = function () { reject(new Error('offline')); };
        document.head.appendChild(s);
      });
    };

    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash'); if (s) s.remove();
      // Hand the files this browser loaded (renderer, fonts) to the offline cache.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.ready.then(function (reg) {
          var urls = performance.getEntriesByType('resource').map(function (e) { return e.name; })
            .filter(function (u) { return u.indexOf(location.origin) === 0; });
          if (reg.active) reg.active.postMessage({ cache: urls });
        });
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
